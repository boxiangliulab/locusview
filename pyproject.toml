[project]
name = "locusview"
version = "0.0.0"
description = "A searchable home for publicly available QTL data."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Boxiang Liu and the locusview contributors" }]
dependencies = [
    # Web stack (ADR-0002). Data-layer deps (duckdb/pysam/...) arrive with the
    # first data feature, once the locuscompare2 DB is documented (ADR-0008, issue #1).
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic-settings>=2.4",
    "pymysql>=1.1",  # legacy MySQL colotool DB — kept for reference, unused by default now
    "pg8000>=1.31",  # pure-Python driver for the new Postgres locuscompare2 DB
]

[project.scripts]
locusview = "locusview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx>=0.27",      # required by fastapi.testclient.TestClient
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/locusview"]
# displays/ (HTML templates) and static/ live in the sibling src/frontend/ folder, not inside the
# locusview package dir (see web.py's _STATIC_DIR comment) — this app is never deployed as a standalone
# wheel today (uv run always executes from a full source checkout, local or in the Docker
# image — see Dockerfile's "COPY . ." before "uv run"), so that's fine as-is; a real standalone
# wheel distribution would need a force-include (or an importlib.resources-based rework) to
# bundle frontend/ alongside the package, which isn't worth adding speculatively.

# ── Ruff: linter + formatter ───────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
# src/backend is the locusview package's actual root now (see the wheel packages= comment above)
# — needed so ruff's import sorter still recognizes "locusview" as first-party, not third-party.
src = ["src/backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Allow scientific unicode (×, −, ², β, r², −log₁₀) in docstrings/comments/strings.
ignore = ["RUF001", "RUF002", "RUF003"]

# ── pytest + coverage gate ─────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=locusview --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["locusview"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

# ── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
packages = ["locusview"]
strict = true

# uvicorn does not ship type information (no py.typed marker).
[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# pymysql does not ship type information.
[[tool.mypy.overrides]]
module = ["pymysql.*"]
ignore_missing_imports = true

# pg8000 does not ship type information.
[[tool.mypy.overrides]]
module = ["pg8000.*"]
ignore_missing_imports = true
